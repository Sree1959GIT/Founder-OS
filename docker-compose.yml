# Docker is used for Qdrant only. Everything else runs natively (see README).
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: founderos-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
