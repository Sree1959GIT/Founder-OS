[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "founderos-backend"
version = "0.1.0"
description = "FounderOS backend: FastAPI gateway, deterministic financial engine, agents and voice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27",
    "loguru>=0.7",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "pypdf>=5",
    "tiktoken>=0.8",
    "rank-bm25>=0.2.2",
    "watchfiles>=0.24",
    "langgraph>=1.0,<2",
]

# Optional: Claude on the founder's subscription via the Claude Agent SDK (needs the Claude Code CLI).
# Anthropic and Gemini are called over REST with httpx and need no extra package.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
gpu = [
    "nvidia-ml-py>=12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
